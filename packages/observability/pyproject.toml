[project]
name = "cloudops-observability"
version = "0.1.0"
description = "OpenTelemetry for every service: traces, metrics, structured logs, scrubbed of tenant and secret data"
requires-python = ">=3.12,<3.13"
dependencies = [
    "opentelemetry-api>=1.38",
    "opentelemetry-sdk>=1.38",
    "opentelemetry-exporter-otlp-proto-http>=1.38",
]

[project.optional-dependencies]
fastapi = ["opentelemetry-instrumentation-fastapi>=0.59b0"]
httpx = ["opentelemetry-instrumentation-httpx>=0.59b0"]
temporal = ["temporalio[opentelemetry]>=1.34"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudops_observability"]
