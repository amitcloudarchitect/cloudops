[project]
name = "cloudops-evals"
version = "0.1.0"
description = "Evaluation harness: golden set, scoring, baseline regression gate, replayed model responses"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cloudops-tenancy",
    "cloudops-gateway",
    "cloudops-agents",
    "pydantic>=2.9",
    "temporalio>=1.34",
]

[tool.uv.sources]
cloudops-tenancy = { workspace = true }
cloudops-gateway = { workspace = true }
cloudops-agents = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudops_evals"]
