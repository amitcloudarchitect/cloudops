[project]
name = "cloudops-config"
version = "0.1.0"
description = "Explicit backend selection: local containers or Azure via workload identity, never a silent fallback"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
# cloudops_config.temporal: the workers' connection helper. The API never imports it.
temporal = ["temporalio>=1.34"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudops_config"]
