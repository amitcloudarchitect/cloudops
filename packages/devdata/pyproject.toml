[project]
name = "cloudops-devdata"
version = "0.1.0"
description = "Local development only: .env.local generation, Azurite provisioning and the synthetic seed"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cloudops-tenancy",
    "cloudops-config",
    "azure-storage-blob>=12.24",
    "pyjwt[crypto]>=2.10",
]

[tool.uv.sources]
cloudops-tenancy = { workspace = true }
cloudops-config = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudops_devdata"]
