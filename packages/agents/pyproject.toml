[project]
name = "cloudops-agents"
version = "0.1.0"
description = "The agent layer: versioned prompts, schema-validated output, allowlisted tools, Temporal activities. No framework."
requires-python = ">=3.12,<3.13"
dependencies = [
    "cloudops-tenancy",
    "cloudops-gateway",
    "pydantic>=2.9",
    "temporalio>=1.34",
]

[tool.uv.sources]
cloudops-tenancy = { workspace = true }
cloudops-gateway = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudops_agents"]
