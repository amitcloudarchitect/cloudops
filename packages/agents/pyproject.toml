[project]
name = "cloudops-agents"
version = "0.1.0"
description = "The agent layer: versioned prompts, schema-validated output, allowlisted tools, Temporal activities. No framework."
requires-python = ">=3.12,<3.13"
dependencies = [
    "azure-identity>=1.19",
    "azure-core[aio]>=1.32",  # aiohttp: azure.identity.aio's transport
    "cloudops-config[temporal]",
    "cloudops-tenancy",
    "cloudops-gateway",
    "cloudops-observability[temporal]",
    "pydantic>=2.9",
    "temporalio>=1.34",
]

[tool.uv.sources]
cloudops-config = { workspace = true }
cloudops-tenancy = { workspace = true }
cloudops-gateway = { workspace = true }
cloudops-observability = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudops_agents"]
