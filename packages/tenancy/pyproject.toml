[project]
name = "cloudops-tenancy"
version = "0.1.0"
description = "Mandatory data access wrapper: the only way to reach the platform database"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary]>=3.2",
    "httpx>=0.28",
    # API only (no SDK): a span per statement, a no-op until a service turns
    # telemetry on (packages/observability).
    "opentelemetry-api>=1.38",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudops_tenancy"]
