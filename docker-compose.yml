# Local development stack: the platform's backing services on a laptop, no Azure.
#
#   make up      build, start, wait for health, migrate, create blob containers
#   make down    stop (data kept in volumes); make reset wipes and reseeds
#
# Run through the Makefile, which passes --env-file .env.local. Every password
# comes from that file (generated by `make env`, gitignored); `:?` makes a missing
# one fail here rather than start a service with an empty password.
#
# Every port binds to 127.0.0.1 only. Departures from production, all deliberate
# and local-only, are listed in README.md ("How local differs from Azure").

name: cloudops

services:
  # PostgreSQL 16 + pgvector + pg_partman: the same image CI and Testcontainers
  # use. Parameters are the LLD's (Data tier) so a query that times out or sorts
  # to disk in production does the same here.
  postgres:
    build: db/test-image
    image: cloudops-postgres:local
    command:
      - postgres
      - -c
      - max_connections=400
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=1GB
      - -c
      - random_page_cost=1.1
      - -c
      - log_min_duration_statement=500ms
      - -c
      - row_security=on
      # 30 s is the application value and the server default. Reporting's 300 s is
      # a per-role override, applied to the reporting role when it exists.
      - -c
      - statement_timeout=30s
      - -c
      - idle_in_transaction_session_timeout=60s
      - -c
      - password_encryption=scram-sha-256
      - -c
      - shared_preload_libraries=pg_stat_statements,pg_partman_bgw
      # pg_partman's background worker creates future partitions, as in production.
      # On the very first start it logs one FATAL (role does not exist) from the
      # temporary server that runs the init script; harmless, and never again.
      - -c
      - pg_partman_bgw.dbname=cloudops
      - -c
      - pg_partman_bgw.role=cloudops_migrator
      - -c
      - pg_partman_bgw.interval=3600
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?run make env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      CLOUDOPS_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?run make env}
      CLOUDOPS_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?run make env}
      CLOUDOPS_INGEST_PASSWORD: ${POSTGRES_INGEST_PASSWORD:?run make env}
    volumes:
      - ./infra/local/postgres/init.sh:/docker-entrypoint-initdb.d/10-cloudops.sh:ro
      - ./db/bootstrap:/cloudops/bootstrap:ro
      - postgres-data:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:5432:5432
    healthcheck:
      # Healthy only once the init script has created the cloudops database.
      test: [CMD-SHELL, pg_isready -U postgres -d cloudops -h 127.0.0.1]
      interval: 2s
      timeout: 3s
      retries: 60

  # LLD: volatile-lru, AOF persistence. Production adds TLS and Entra auth.
  redis:
    image: redis:7.4.6-alpine
    command: [redis-server, --appendonly, "yes", --maxmemory, 256mb, --maxmemory-policy, volatile-lru]
    volumes:
      - redis-data:/data
    ports:
      - 127.0.0.1:6379:6379
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30

  # Temporal's single-binary dev server, UI included (http://localhost:8233).
  # SQLite on a volume, so workflow history survives `make down`.
  temporal:
    image: temporalio/temporal:1.4.1
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --ui-ip
      - 0.0.0.0
      - --db-filename
      - /data/temporal.db
      - --namespace
      - default
    user: "0:0"  # the volume is root-owned on first mount
    volumes:
      - temporal-data:/data
    ports:
      - 127.0.0.1:7233:7233
      - 127.0.0.1:8233:8233
    healthcheck:
      test: [CMD, temporal, operator, cluster, health, --address, 127.0.0.1:7233]
      interval: 3s
      timeout: 5s
      retries: 40

  # Stands in for the bronze and reports storage accounts. Blob service only.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    command:
      - azurite-blob
      - --blobHost
      - 0.0.0.0
      - --location
      - /data
      # Newer SDKs send API versions Azurite has not caught up with yet.
      - --skipApiVersionCheck
    volumes:
      - azurite-data:/data
    ports:
      - 127.0.0.1:10000:10000
    healthcheck:
      test: [CMD-SHELL, "nc -z 127.0.0.1 10000"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Stands in for the telemetry store (LLD open item L1: ClickHouse or ADX).
  # As the LLD requires: no default user, one user per service.
  clickhouse:
    image: clickhouse/clickhouse-server:24.8.14.39
    environment:
      # Admin user for local provisioning only; the entrypoint removes `default`.
      CLICKHOUSE_USER: cloudops_admin
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD:?run make env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      CLICKHOUSE_DB: telemetry
      CLOUDOPS_TELEMETRY_PASSWORD: ${CLICKHOUSE_TELEMETRY_PASSWORD:?run make env}
    volumes:
      - ./infra/local/clickhouse/init.sh:/docker-entrypoint-initdb.d/10-cloudops.sh:ro
      - clickhouse-data:/var/lib/clickhouse
    ports:
      - 127.0.0.1:8123:8123
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 2s
      timeout: 3s
      retries: 60

volumes:
  postgres-data:
  redis-data:
  temporal-data:
  azurite-data:
  clickhouse-data:
