# Alembic configuration. Holds no connection string: env.py reads the
# migration role's DSN from the file named by CLOUDOPS_MIGRATION_DSN_FILE
# (mounted by the Key Vault CSI driver in the pipeline job).

[alembic]
script_location = %(here)s/db/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
