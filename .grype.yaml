# Reviewed exceptions to the image gate (scripts/image-check.sh). Anything critical or
# high not listed here fails the build.
#
# Rules for adding one:
#   - name the exact CVE *and* the package; never a blanket rule. Grype reads the
#     package name as a regular expression: anchor it and escape '+';
#   - only for a package of the base image (gcr.io/distroless/cc-debian13), never one
#     our code or our copied libraries bring in;
#   - pin fix-state, so the rule stops matching the day Debian ships a fix, and the
#     gate then fails until the base digest is bumped;
#   - give a reason and the review date.
#
# Reviewed 2026-10-28 (step 11): no Debian 13 fix exists for any of these.

ignore:
  # glibc: core C library, present in every Debian-based image.
  - vulnerability: CVE-2026-19499
    fix-state: wont-fix
    package: { name: '^libc6$', type: deb }
    reason: "distroless base; Debian 13 won't fix; reviewed 2026-10-28"
  - vulnerability: CVE-2026-5435
    fix-state: wont-fix
    package: { name: '^libc6$', type: deb }
    reason: "distroless base; Debian 13 won't fix; reviewed 2026-10-28"
  # Published 2026-10-31, High; Debian 13 has no fixed libc6 yet (state not-fixed in
  # the pinned base). Stops matching once Debian ships a fix; then bump the base digest.
  - vulnerability: CVE-2026-84243
    fix-state: not-fixed
    package: { name: '^libc6$', type: deb }
    reason: "distroless base; no Debian 13 fix yet; reviewed 2026-10-31"
  # GCC 14 runtime (libgcc_s, libstdc++, libgomp); Rust and C++ extensions need it.
  - vulnerability: CVE-2026-102010
    fix-state: wont-fix
    package: { name: '^gcc-14-base$', type: deb }
    reason: "distroless base; Debian 13 won't fix; reviewed 2026-10-28"
  - vulnerability: CVE-2026-102010
    fix-state: wont-fix
    package: { name: '^libgcc-s1$', type: deb }
    reason: "distroless base; Debian 13 won't fix; reviewed 2026-10-28"
  - vulnerability: CVE-2026-102010
    fix-state: wont-fix
    package: { name: '^libgomp1$', type: deb }
    reason: "distroless base; Debian 13 won't fix; reviewed 2026-10-28"
  - vulnerability: CVE-2026-102010
    fix-state: wont-fix
    package: { name: '^libstdc\+\+6$', type: deb }
    reason: "distroless base; Debian 13 won't fix; reviewed 2026-10-28"
  - vulnerability: CVE-2026-95619
    fix-state: wont-fix
    package: { name: '^gcc-14-base$', type: deb }
    reason: "distroless base; Debian 13 won't fix; reviewed 2026-10-28"
  - vulnerability: CVE-2026-95619
    fix-state: wont-fix
    package: { name: '^libgcc-s1$', type: deb }
    reason: "distroless base; Debian 13 won't fix; reviewed 2026-10-28"
  - vulnerability: CVE-2026-95619
    fix-state: wont-fix
    package: { name: '^libgomp1$', type: deb }
    reason: "distroless base; Debian 13 won't fix; reviewed 2026-10-28"
  - vulnerability: CVE-2026-95619
    fix-state: wont-fix
    package: { name: '^libstdc\+\+6$', type: deb }
    reason: "distroless base; Debian 13 won't fix; reviewed 2026-10-28"
  # zlib: no fixed Debian 13 package yet; re-check on every base bump.
  - vulnerability: CVE-2026-85091
    fix-state: not-fixed
    package: { name: '^zlib1g$', type: deb }
    reason: "distroless base; no Debian 13 fix yet; reviewed 2026-10-28"

  # SCA false positives (step 19, ADR 0022): grype matches Grafana *server* CVEs to the
  # Grafana *Terraform provider* in stacks/03b-dashboards/.terraform.lock.hcl by name.
  # The provider is a Terraform plugin, not Grafana; the server is Azure Managed
  # Grafana, patched by Microsoft. Exact CVE and package each; a new provider CVE
  # still fails. Reviewed 2026-10-31.
  - vulnerability: CVE-2019-15043
    package: { name: '^registry\.terraform\.io/grafana/grafana$', type: terraform }
    reason: "Grafana server CVE matched to the Terraform provider by name; reviewed 2026-10-31"
