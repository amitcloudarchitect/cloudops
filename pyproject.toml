[project]
name = "cloudops-platform"
version = "0.0.0"
description = "Getronics CloudOps platform monorepo root"
requires-python = ">=3.12,<3.13"
dependencies = ["cloudops-tenancy", "cloudops-config", "cloudops-devdata", "cloudops-api", "cloudops-connectors", "cloudops-gateway", "cloudops-agents", "cloudops-evals", "alembic>=1.14"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/tenancy", "packages/config", "packages/devdata", "services/api", "connectors", "services/gateway", "packages/agents", "packages/evals"]

[tool.uv.sources]
cloudops-tenancy = { workspace = true }
cloudops-config = { workspace = true }
cloudops-devdata = { workspace = true }
cloudops-api = { workspace = true }
cloudops-connectors = { workspace = true }
cloudops-gateway = { workspace = true }
cloudops-agents = { workspace = true }
cloudops-evals = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.8",
    "mypy>=1.13",
    "pyyaml>=6.0",
    "types-pyyaml>=6.0",
    "types-defusedxml>=0.7",
]

# The coverage release gate (LLD, CI/CD): 80% on tenancy and calculation code. Step 16
# adds the commercial engine here. Measured by CI's tests job (coverage report
# --fail-under=80 over exactly these files).
[tool.coverage.run]
branch = true
source = ["packages/tenancy/src", "services/gateway/src/cloudops_gateway"]

[tool.coverage.report]
include = [
    "packages/tenancy/src/*",
    "services/gateway/src/cloudops_gateway/pricing.py",
]
show_missing = true
skip_empty = true

[tool.pytest.ini_options]
testpaths = ["packages", "services", "connectors", "db", "tools"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "--strict-markers --import-mode=importlib"
markers = [
    "isolation: cross-tenant isolation case; a release gate (run with -m isolation)",
    "integration: needs a real PostgreSQL 16 database",
    "evaluation: the AI evaluation suite; a release gate (run with -m evaluation)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["reference"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF", "ASYNC", "PT"]

[tool.ruff.lint.isort]
known-first-party = ["cloudops_tenancy", "cloudops_config", "cloudops_devdata", "cloudops_api", "cloudops_connectors", "cloudops_gateway", "cloudops_agents", "cloudops_evals"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S608"]
# Migrations build DDL from module constants, never from input.
"db/migrations/**" = ["S608"]

[tool.mypy]
strict = true
python_version = "3.12"
exclude = ["^reference/", "^\\.venv/"]
explicit_package_bases = true
mypy_path = "packages/tenancy/src:packages/config/src:packages/devdata/src:services/api/src:connectors/src:services/gateway/src:packages/agents/src:packages/evals/src"

[[tool.mypy.overrides]]
module = ["testcontainers.*", "jsonschema.*"]
ignore_missing_imports = true
