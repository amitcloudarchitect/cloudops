# The main pipeline (LLD, CI/CD; ADR 0013): every release gate, then push the images
# to ACR, sign them, and open a pull request pointing dev at them. The release bot
# merges it once its checks pass; Argo CD pulls the change. The pipeline never
# touches the cluster and never applies Terraform.
name: main

on:
  push:
    branches: [main]
    # A tag bump changes only the dev overlay: nothing to rebuild, and rebuilding
    # would open another bump, forever.
    paths-ignore:
      - infra/gitops/overlays/dev/kustomization.yaml
      - infra/gitops/overlays/dev/workers/kustomization.yaml

permissions:
  contents: read

concurrency:
  group: main
  cancel-in-progress: false # a release half done is worse than one queued

jobs:
  gates:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      security-events: write # CodeQL
      id-token: write # terraform plan as the CI identity

  release:
    name: push and sign images
    needs: gates
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # Azure (push) and Sigstore (keyless signing)
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    env:
      REGISTRY: ${{ vars.ACR_LOGIN_SERVER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: registry login (the CI identity's AcrPush; no admin user, no password)
        run: az acr login --name "${REGISTRY%%.*}"
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        id: syft
        with:
          syft-version: v1.55.0
      - uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        id: grype-bin
        with:
          grype-version: v0.121.0
      # The download actions report where they put each tool; image-check.sh finds
      # them on PATH.
      - name: syft and grype on PATH
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          GRYPE: ${{ steps.grype-bin.outputs.cmd }}
        run: |
          dirname "$SYFT" >> "$GITHUB_PATH"
          dirname "$GRYPE" >> "$GITHUB_PATH"
      # Built once, scanned, and only then pushed: the images in the registry are
      # exactly the ones the gate passed.
      - name: build
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          REVISION: ${{ github.sha }}
        run: docker buildx bake -f docker-bake.hcl --load
      - name: SBOM, non-root check, and the critical/high gate
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: scripts/image-check.sh $(for i in api connector-servicenow worker-ai migrate; do echo "$REGISTRY/$i:$TAG"; done)
      - name: push
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: for i in api connector-servicenow worker-ai migrate; do docker push "$REGISTRY/$i:$TAG"; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ steps.tag.outputs.tag }}
          path: build/sbom/
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Keyless: the signature binds the image digest to this workflow, on main, in
      # this repository, through GitHub's OIDC identity; recorded in Sigstore's public
      # transparency log. Verify with: cosign verify <image@digest>
      #   --certificate-identity-regexp '^https://github.com/<repo>/.github/workflows/main.yml@refs/heads/main$'
      #   --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: sign by digest
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          for image in api connector-servicenow worker-ai migrate; do
            # The digest the registry stored for what was just pushed.
            digest="$(docker image inspect "$REGISTRY/$image:$TAG" --format '{{index .RepoDigests 0}}')"
            digest="${digest#*@}"
            cosign sign --yes "$REGISTRY/$image@$digest"
            echo "signed $REGISTRY/$image@$digest"
          done

  bump-dev:
    name: point dev at the new images
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # The release bot (a GitHub App, ADR 0013): its pull requests run CI like
      # anyone's, and it is the ruleset's only bypass actor, for its own merges.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: bot
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.bot.outputs.token }}
      - name: open and auto-merge the tag bump
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          TAG: ${{ needs.release.outputs.tag }}
          BOT: ${{ steps.bot.outputs.app-slug }}
        run: |
          python3 -I tools/ci/set_image_tag.py "$TAG" api migrate connector-servicenow worker-ai \
            -- infra/gitops/overlays/dev infra/gitops/overlays/dev/workers
          if git diff --quiet; then echo "dev already runs $TAG"; exit 0; fi
          branch="release/dev-$TAG"
          git config user.name "$BOT[bot]"
          git config user.email "$BOT[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "Dev overlay: images $TAG" -m "Built, scanned and signed by the main pipeline from $GITHUB_SHA."
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Dev overlay: images $TAG" \
            --body "Points dev at the images the main pipeline built, scanned and signed from $GITHUB_SHA. Merges itself once its checks pass; Argo CD then rolls dev (the API by canary)."
          gh pr merge "$branch" --auto --squash --delete-branch
