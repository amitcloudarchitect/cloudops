[project]
name = "cloudops-gateway"
version = "0.1.0"
description = "AI gateway: tiers, redaction, quotas, semantic cache, tracing, breaker, tool registry, retrieval"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cloudops-tenancy",
    "cloudops-config",
    "jsonschema>=4.23",
    "httpx>=0.28",
]

[tool.uv.sources]
cloudops-tenancy = { workspace = true }
cloudops-config = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudops_gateway"]
