[project]
name = "cloudops-api"
version = "0.1.0"
description = "Platform API: token validation, server-side scope resolution, BFF, provenance, audit"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cloudops-tenancy",
    "cloudops-config",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.28",
]

[tool.uv.sources]
cloudops-tenancy = { workspace = true }
cloudops-config = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudops_api"]
