[project]
name = "cloudops-domain"
version = "0.1.0"
description = "Domain services: knowledge, assurance and reporting (step 17). Deterministic; no model calls"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cloudops-tenancy",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "cryptography>=43",
]

[tool.uv.sources]
cloudops-tenancy = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudops_domain"]
