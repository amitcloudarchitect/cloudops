[project]
name = "cloudops-connectors"
version = "0.1.0"
description = "Source connectors: raw to bronze first, then normalise, resolve identity, commit with the watermark"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cloudops-tenancy",
    "cloudops-config[temporal]",
    "cloudops-domain",
    "httpx>=0.28",
    "temporalio>=1.34",
    "azure-storage-blob[aio]>=12.24",
    "azure-identity>=1.19",
    "defusedxml>=0.7",
    "azure-eventhub>=5.12",
    "azure-eventhub-checkpointstoreblob-aio>=1.2",
]

[tool.uv.sources]
cloudops-tenancy = { workspace = true }
cloudops-config = { workspace = true }
cloudops-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudops_connectors"]
