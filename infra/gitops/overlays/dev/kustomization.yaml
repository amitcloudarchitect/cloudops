# Dev (crcloudopsdevweu, kv-cloudops-app-dev-weu, network_mode = "public").
#
# Deployed: namespaces and policies, the internal CA, migrations (before the API), the
# API, the operations console (ADR 0017), and the secret sync and certificates
# Temporal needs. The workers are a separate
# Application after Temporal (workers/, applications/dev/workers.yaml): only
# connector-servicenow so far; worker-ai waits for the Azure OpenAI tiers (LLD L12).
#
# Image tags are the only thing the pipeline changes here (step 13); Argo CD
# reconciles. Nothing in this directory is a secret.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/namespaces
  - ../../base/internal-ca
  - ../../base/migrate
  - ../../base/api
  - ../../base/web
  - ../../base/edge
  - ../../base/temporal-secrets
  - ../../base/monitoring
  - values.yaml
images:
  - name: api
    newName: crcloudopsdevweu.azurecr.io/api
    newTag: 70abe87
  - name: migrate
    newName: crcloudopsdevweu.azurecr.io/migrate
    newTag: 70abe87
  - name: web
    newName: crcloudopsdevweu.azurecr.io/web
    newTag: 70abe87
  - name: pause
    newName: crcloudopsdevweu.azurecr.io/pause
    newTag: 3.10.1
patches:
  - path: identity.yaml
  - path: config.yaml
  - path: edge.yaml
replacements:
  - source: { kind: ConfigMap, name: overlay-values, fieldPath: data.dataSubnet }
    targets:  # every policy that names the database
      - select: { kind: NetworkPolicy, name: api }
        fieldPaths: [spec.egress.0.to.0.ipBlock.cidr]
      - select: { kind: NetworkPolicy, name: migrate }
        fieldPaths: [spec.egress.0.to.0.ipBlock.cidr]
      - select: { kind: NetworkPolicy, name: bootstrap-admin }
        fieldPaths: [spec.egress.0.to.0.ipBlock.cidr]
      - select: { kind: NetworkPolicy, name: temporal-database }
        fieldPaths: [spec.egress.0.to.0.ipBlock.cidr]
  - source: { kind: ConfigMap, name: overlay-values, fieldPath: data.frontdoorId }
    targets:  # lock 2: only our Front Door profile reaches the API and the console (ADR 0011)
      - select: { kind: HTTPRoute, name: api }
        fieldPaths: [spec.rules.1.matches.0.headers.0.value]
      - select: { kind: HTTPRoute, name: web }
        fieldPaths: [spec.rules.0.matches.0.headers.0.value]
