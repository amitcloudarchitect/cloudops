# id-cloudops-ingest-dev (stack 05 output workload_client_ids). Not secrets.
# ADR 0028. Before this syncs: stacks 04-data, 04b-rbac and 05-aks applied, and the
# federated credential on app-cloudops-sharepoint-dev for this service account
# (docs/real-connectors.md). Until then the worker cannot get a Graph token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: connector-sharepoint
  namespace: platform-ingest
  annotations:
    azure.workload.identity/client-id: 3ab83a64-7866-4d7c-beb7-28849dd1683a
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: connector-sharepoint
  namespace: platform-ingest
data:
  # The bronze container stack 04-data creates for this source; 04b grants the ingest
  # identity Storage Blob Data Contributor on it alone.
  CLOUDOPS_BRONZE_CONTAINER_URL: https://stcloudopsbronzedevweu.blob.core.windows.net/sharepoint
  # Required by the BLOB component; the connector never writes reports.
  CLOUDOPS_REPORTS_CONTAINER_URL: https://stcloudopsreportsdevweu.blob.core.windows.net/reports
  # app-cloudops-sharepoint-dev, in the dev directory (gtnmpn): a hand-made, single
  # tenant registration with no secret or certificate, holding
  # ListItems.SelectedOperations.Selected.
  CLOUDOPS_SHAREPOINT_CLIENT_ID: c8487213-84c3-4975-845f-b02c4b832f01
  # Folders granted to it, read each: Customer_Documents/Azure_Sponsorship_Account in
  # the Getronics_PubC site's Documents library (a stand-in for the corporate
  # site, which the dev directory cannot reach).
  CLOUDOPS_SHAREPOINT_FOLDERS: b!DT4Hk_BDiEimZVVWGYe2MPKvc43sJ_ZMr0WakM0W5sxylITftUqdQ6t3Htf5wqT0/01474IQMOWIIY5UNXR3ZDLGXEOBDBJD7QU
  # Step 19 (ADR 0022): off until the collector runs in dev (see ../config.yaml).
  CLOUDOPS_TELEMETRY: "off"
  CLOUDOPS_DEPLOYMENT: dev
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: connector-sharepoint
  namespace: platform-ingest
spec:
  parameters:
    clientID: 3ab83a64-7866-4d7c-beb7-28849dd1683a
    keyvaultName: kv-cloudops-app-dev-weu
    tenantId: 2fa5e26d-5ad2-415f-88a2-771caca87cbe
