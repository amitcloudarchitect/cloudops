# Dev workers: applied by the workers Application after Temporal (ADR 0010), since a
# worker is not ready until Temporal answers. connector-servicenow reads the dev
# instance (ADR 0009). worker-ai calls the dev Azure OpenAI account (ADR 0012).
# connector-azure feeds the platform's own cost into the internal tenant (ADR 0023).
#
# Image tags are the only thing the pipeline changes here (step 13). Nothing in
# this directory is a secret.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/connector-servicenow
  - ../../../base/connector-azure
  - ../../../base/worker-ai
  - values.yaml
images:
  - name: connector-servicenow
    newName: crcloudopsdevweu.azurecr.io/connector-servicenow
    newTag: fd7e244
  - name: worker-ai
    newName: crcloudopsdevweu.azurecr.io/worker-ai
    newTag: fd7e244
patches:
  - path: connector-servicenow.yaml
  - path: connector-azure.yaml
  - path: worker-ai.yaml
replacements:
  - source: { kind: ConfigMap, name: overlay-values, fieldPath: data.dataSubnet }
    targets:
      - select: { kind: NetworkPolicy, name: connector-servicenow }
        fieldPaths: [spec.egress.1.to.0.ipBlock.cidr]
      - select: { kind: NetworkPolicy, name: connector-azure }
        fieldPaths: [spec.egress.1.to.0.ipBlock.cidr]
      - select: { kind: NetworkPolicy, name: worker-ai }
        fieldPaths: [spec.egress.1.to.0.ipBlock.cidr]
