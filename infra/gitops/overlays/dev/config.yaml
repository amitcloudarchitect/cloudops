apiVersion: v1
kind: ConfigMap
metadata:
  name: api
  namespace: platform-api
data:
  CLOUDOPS_ENTRA_TENANT_ID: 2fa5e26d-5ad2-415f-88a2-771caca87cbe
  # app-cloudops-api-dev's client ID: v2 tokens carry it as the audience.
  CLOUDOPS_API_AUDIENCE: f037f7b8-38cc-4add-8aa7-254b4a117e5d
  # The console's origins. The staff host (ADR 0017) serves console and API, so its
  # calls are same-origin. The customer portal host (ADR 0018, stack 06-edge) serves
  # the same console, which calls the API on the staff host: cross-origin, so CORS
  # must admit it.
  CLOUDOPS_WEB_ORIGINS: https://cloudops-dev-dne7dpdpfrgfccej.z02.azurefd.net,https://cloudops-portal-dev-c7fcgehpf7h0ame4.z02.azurefd.net
  # Step 19 (ADR 0021): JSON logs only until the collector runs in dev, which needs
  # id-cloudops-observability-dev (stacks 02, 04b, 05). Then this line goes.
  CLOUDOPS_TELEMETRY: "off"
  CLOUDOPS_DEPLOYMENT: dev
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: migrate
  namespace: platform-api
data:
  # No password: the job uses an Entra token as id-cloudops-migrate-dev.
  dsn: postgresql://id-cloudops-migrate-dev@psql-cloudops-dev-neu.postgres.database.azure.com:5432/cloudops?sslmode=verify-full&sslrootcert=system
  # ADR 0015: in dev one person may propose and approve a customer mapping.
  # UAT and production never set this, so they keep the two-person rule.
  mapping_approvers: "1"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web
  namespace: platform-web
data:
  # Front Door's host, which serves the API's /v1 as well as the console.
  CLOUDOPS_WEB_API_BASE: https://cloudops-dev-dne7dpdpfrgfccej.z02.azurefd.net
  # app-cloudops-web-dev: a public client, no secret, pre-authorised on the API.
  CLOUDOPS_WEB_ENTRA_CLIENT_ID: 019f8f28-8c02-4eb7-83ef-f8c80a870ff8
  CLOUDOPS_WEB_ENTRA_TENANT_ID: 2fa5e26d-5ad2-415f-88a2-771caca87cbe
  # app-cloudops-api-dev's delegated scope; the API requires access_as_user.
  CLOUDOPS_WEB_API_SCOPE: api://f037f7b8-38cc-4add-8aa7-254b4a117e5d/access_as_user
