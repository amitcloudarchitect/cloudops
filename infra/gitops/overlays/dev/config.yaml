apiVersion: v1
kind: ConfigMap
metadata:
  name: api
  namespace: platform-api
data:
  CLOUDOPS_ENTRA_TENANT_ID: 2fa5e26d-5ad2-415f-88a2-771caca87cbe
  # app-cloudops-api-dev's client ID: v2 tokens carry it as the audience.
  CLOUDOPS_API_AUDIENCE: f037f7b8-38cc-4add-8aa7-254b4a117e5d
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: migrate
  namespace: platform-api
data:
  # No password: the job uses an Entra token as id-cloudops-migrate-dev.
  dsn: postgresql://id-cloudops-migrate-dev@psql-cloudops-dev-neu.postgres.database.azure.com:5432/cloudops?sslmode=verify-full&sslrootcert=system
