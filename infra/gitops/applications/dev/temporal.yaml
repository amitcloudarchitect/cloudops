# Temporal, self-hosted (ADR 0008), on the npai pool, persisting to two databases
# on the platform's PostgreSQL server (created by scripts/db_dev_logins.py). The
# password comes from the temporal-db Secret, synced from Key Vault by the
# platform Application (wave 0), with the TLS certificates (ADR 0010). Every
# connection is mutual TLS from the internal CA: workers, KEDA and the Web UI to the
# frontend, and the services to each other. The frontend is also reachable only from
# the worker namespaces and KEDA (NetworkPolicy).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: temporal
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://go.temporal.io/helm-charts
    chart: temporal
    targetRevision: 1.7.0
    helm:
      valuesObject:
        # Images mirrored into ACR, pinned by digest (ADR 0008, third-party images).
        server:
          image:
            repository: crcloudopsdevweu.azurecr.io/temporalio/server
            tag: "1.32.0@sha256:c3e752127759616bb1615e0f9ba0e21635aeb5fdeb922de4f371c350955f46ae"
          replicaCount: 1
          nodeSelector: { cloudops.getronics.com/pool: ai }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile: { type: RuntimeDefault }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          # Secrets from base/temporal-secrets/certificates.yaml (cert-manager).
          tls:
            internode:
              enabled: true
              secretName: temporal-internode-tls
              requireClientAuth: true
              serverName: temporal-internode.temporal.svc
            frontend:
              enabled: true
              secretName: temporal-frontend-tls
              requireClientAuth: true
              serverName: temporal-frontend.temporal.svc.cluster.local
          config:
            logLevel: info
            # Re-read renewed certificate files (cert-manager renews 30 days early).
            tls:
              refreshInterval: 1h
            persistence:
              defaultStore: default
              visibilityStore: visibility
              # Fixed for the life of the cluster's Temporal; never change it.
              numHistoryShards: 512
              datastores:
                default:
                  sql:
                    pluginName: postgres12
                    driverName: postgres12
                    databaseName: temporal
                    connectAddr: psql-cloudops-dev-neu.postgres.database.azure.com:5432
                    connectProtocol: tcp
                    user: temporal
                    existingSecret: temporal-db
                    secretKey: password
                    createDatabase: false
                    manageSchema: true
                    maxConns: 20
                    maxIdleConns: 20
                    maxConnLifetime: 1h
                    tls:
                      enabled: true
                      enableHostVerification: true
                      serverName: psql-cloudops-dev-neu.postgres.database.azure.com
                visibility:
                  sql:
                    pluginName: postgres12
                    driverName: postgres12
                    databaseName: temporal_visibility
                    connectAddr: psql-cloudops-dev-neu.postgres.database.azure.com:5432
                    connectProtocol: tcp
                    user: temporal
                    existingSecret: temporal-db
                    secretKey: password
                    createDatabase: false
                    manageSchema: true
                    maxConns: 10
                    maxIdleConns: 10
                    maxConnLifetime: 1h
                    tls:
                      enabled: true
                      enableHostVerification: true
                      serverName: psql-cloudops-dev-neu.postgres.database.azure.com
            namespaces:
              create: true
              namespace:
                - name: default
                  retention: 3d
        admintools:
          enabled: false
          # Also the image of the schema and namespace jobs.
          image:
            repository: crcloudopsdevweu.azurecr.io/temporalio/admin-tools
            tag: "1.32.0@sha256:a9f84fb9a374b2374fe2e67c8efc0468ff3f1c66c8a0b14597ec86e349e62bca"
        schema:
          containerSecurityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile: { type: RuntimeDefault }
        web:
          enabled: true
          image:
            repository: crcloudopsdevweu.azurecr.io/temporalio/ui
            tag: "2.54.1@sha256:ff0943fe532b8e33c46cd28b29e81e0ce0b6f55b9ee50a38ef1b437cc4de3fa5"
          tls:
            enabled: true
            secretName: temporal-web-tls
            serverName: temporal-frontend.temporal.svc.cluster.local
            enableHostVerification: true
          nodeSelector: { cloudops.getronics.com/pool: ai }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile: { type: RuntimeDefault }
          containerSecurityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: temporal
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry: { limit: 10, backoff: { duration: 30s, factor: 2, maxDuration: 10m } }
