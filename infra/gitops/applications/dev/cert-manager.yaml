# cert-manager: issues the internal CA's certificates for Temporal's mutual TLS
# (ADR 0010). First of all applications: the CA (platform, wave 0) and every
# Certificate after it need its CRDs. No ACME and no public issuer; nothing here
# faces the internet.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.21.3
    helm:
      valuesObject:
        # Mirrored into ACR at these digests (ADR 0008, third-party images).
        imageRegistry: crcloudopsdevweu.azurecr.io
        image: { digest: "sha256:9f4f96a33c7774cef24466fcd85031997531a03a8d117f151126baa8d1290dcc" }
        crds:
          enabled: true
          keep: true  # deleting the app must never delete every Certificate
        global:
          nodeSelector: { cloudops.getronics.com/pool: app }
        # A deleted Certificate takes its Secret with it: no orphaned keys.
        enableCertificateOwnerRef: true
        resources:
          requests: { cpu: 20m, memory: 64Mi }
          limits: { memory: 256Mi }
        webhook:
          image: { digest: "sha256:055ac8e9de6a0ba6763794838fe38944acc650f68ebe1b01dd8be079e580f458" }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
        cainjector:
          image: { digest: "sha256:083d0e906f8eb44e255fe4ff817ae54e49f9ed82e22f1011bb4e9e4f4b8a641f" }
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { memory: 256Mi }
        # A Helm post-install hook; Argo CD's health checks on the Certificates do this job.
        startupapicheck: { enabled: false }
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  # Not drift: cainjector writes the webhook's CA bundle in the cluster, and AKS's
  # admissions enforcer adds two namespace exclusions (control-plane, managedby=aks)
  # to every webhook so none can block its system namespaces. Only those entries are
  # ignored; any other change to the selector still shows.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: cert-manager-webhook
      jqPathExpressions: &aks-webhook-drift
        - .webhooks[].clientConfig.caBundle
        - '.webhooks[].namespaceSelector.matchExpressions[] | select(.key == "control-plane" or .key == "kubernetes.azure.com/managedby")'
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: cert-manager-webhook
      jqPathExpressions: *aks-webhook-drift
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true, RespectIgnoreDifferences=true]
    retry: { limit: 10, backoff: { duration: 30s, factor: 2, maxDuration: 10m } }
