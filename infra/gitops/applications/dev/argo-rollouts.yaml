# Argo Rollouts: canary releases for the API (ADR 0008). No dashboard.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-rollouts
    targetRevision: 2.43.8
    helm:
      valuesObject:
        dashboard: { enabled: false }
        controller:
          replicas: 1
          # Step 19: its rollout events feed the rollback-rate alert (stack 03), scraped
          # by managed Prometheus (base/observability/ama-metrics-prometheus-config.yaml).
          metrics: { enabled: true }
          # Mirrored into ACR, pinned by digest (ADR 0008, third-party images).
          image:
            registry: crcloudopsdevweu.azurecr.io
            repository: argoproj/argo-rollouts
            tag: "v1.10.1@sha256:fbcc4cf0a29da25d86230992b1dfdeadf30b6f1baa74ea7c9c98e3e580769396"
          nodeSelector: { cloudops.getronics.com/pool: app }
          # The Gateway API traffic router (ADR 0011), from its image mirrored into ACR,
          # never downloaded at runtime. Copied into the chart's plugin-bin directory;
          # the controller checks the binary's SHA-256 before running it.
          initContainers:
            - name: copy-gatewayapi-plugin
              image: crcloudopsdevweu.azurecr.io/argoproj-labs/rollouts-plugin-trafficrouter-gatewayapi:v0.17.0@sha256:bc40d5edf13307e455f6c18cbf9cc79715165cbee8b05a674fd88119f119d4a2
              command: ["/bin/sh", "-c"]
              args: ["cp /bin/rollouts-plugin-trafficrouter-gatewayapi /plugins/"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              resources:
                requests: { cpu: 10m, memory: 16Mi }
                limits: { memory: 64Mi }
              volumeMounts:
                - { name: gatewayapi-plugin, mountPath: /plugins }
          volumes:
            - name: gatewayapi-plugin
              emptyDir: { sizeLimit: 128Mi }
          volumeMounts:
            - { name: gatewayapi-plugin, mountPath: /plugins, readOnly: true }
          trafficRouterPlugins:
            - name: argoproj-labs/gatewayAPI
              location: file:///plugins/rollouts-plugin-trafficrouter-gatewayapi
              sha256: 31fac7d150b5bd2df6f55a49354dbf05123c093d02f929c409ce4edf57626103
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry: { limit: 10, backoff: { duration: 30s, factor: 2, maxDuration: 10m } }
