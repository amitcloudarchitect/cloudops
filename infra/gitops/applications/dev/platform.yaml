# The platform: namespaces, policies, the migration job, the API and console Rollouts and
# Temporal's secret sync (overlays/dev), in that order (sync waves).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/amitcloudarchitect/cloudops.git
    targetRevision: main
    path: infra/gitops/overlays/dev
  destination:
    server: https://kubernetes.default.svc
  # Argo Rollouts owns the API's and the console's route weights and their
  # in-progress label during a canary (ADR 0011): self-heal must not reset them.
  ignoreDifferences:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: api
      namespace: platform-api
      jqPathExpressions:
        - .spec.rules[].backendRefs[].weight
        - '.metadata.labels."rollouts.argoproj.io/gatewayapi-canary"'
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: web
      namespace: platform-web
      jqPathExpressions:
        - .spec.rules[].backendRefs[].weight
        - '.metadata.labels."rollouts.argoproj.io/gatewayapi-canary"'
  syncPolicy:
    syncOptions: [RespectIgnoreDifferences=true]
    automated: { prune: true, selfHeal: true }
    retry: { limit: 10, backoff: { duration: 30s, factor: 2, maxDuration: 10m } }
