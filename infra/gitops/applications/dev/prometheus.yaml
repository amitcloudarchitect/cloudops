# A small Prometheus for canary analysis only (ADR 0008): the Gateway API proxies' metrics,
# two days, no alerting, no exporters. Not the platform's observability stack.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus
    targetRevision: 29.40.0
    helm:
      valuesObject:
        alertmanager: { enabled: false }
        kube-state-metrics: { enabled: false }
        prometheus-node-exporter: { enabled: false }
        prometheus-pushgateway: { enabled: false }
        # Images mirrored into ACR, pinned by digest (ADR 0008, third-party images).
        server:
          image:
            repository: crcloudopsdevweu.azurecr.io/prometheus/prometheus
            tag: v3.15.1
            digest: "sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2"
          retention: 2d
          persistentVolume: { enabled: false }
          nodeSelector: { cloudops.getronics.com/pool: app }
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile: { type: RuntimeDefault }
          containerSecurityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
        configmapReload:
          prometheus:
            image:
              repository: crcloudopsdevweu.azurecr.io/prometheus-operator/prometheus-config-reloader
              tag: v0.94.2
              digest: "sha256:a1897c67478bc23434534e91ad3855280771196b1daf17144db9dbcb655bef71"
            containerSecurityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ALL] }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry: { limit: 10, backoff: { duration: 30s, factor: 2, maxDuration: 10m } }
