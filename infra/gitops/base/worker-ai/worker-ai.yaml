# Federated to id-cloudops-ai-{env} (stack 05).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker-ai
  annotations:
    azure.workload.identity/client-id: SET-IN-OVERLAY
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: worker-ai
data:
  CLOUDOPS_ENV: azure
  CLOUDOPS_SECRETS_DIR: /mnt/secrets
  CLOUDOPS_TEMPORAL_ADDRESS: temporal-frontend.temporal.svc.cluster.local:7233
  CLOUDOPS_TEMPORAL_NAMESPACE: default
  CLOUDOPS_TEMPORAL_TLS_DIR: /mnt/temporal-tls  # the Certificate below
---
# Its client certificate for Temporal (mutual TLS, ADR 0010), also KEDA's.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: worker-ai-temporal
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretName: worker-ai-temporal-tls
  duration: 2160h
  renewBefore: 720h
  privateKey: { algorithm: ECDSA, size: 256, encoding: PKCS8, rotationPolicy: Always }
  commonName: worker-ai
  uris: [spiffe://cloudops.internal/ns/platform-ai/sa/worker-ai]
  usages: [client auth]
  issuerRef: { group: cert-manager.io, kind: ClusterIssuer, name: cloudops-internal-ca }
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: worker-ai
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: SET-IN-OVERLAY
    keyvaultName: SET-IN-OVERLAY
    tenantId: SET-IN-OVERLAY
    objects: |
      array:
        - |
          objectName: postgres-app-dsn
          objectType: secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-ai
spec:
  replicas: 1  # KEDA owns the count (scaledobject below)
  selector:
    matchLabels:
      app.kubernetes.io/name: worker-ai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker-ai
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: worker-ai
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60  # let in-flight activities finish
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532  # the certificate's key is group-readable only
        seccompProfile: { type: RuntimeDefault }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: cloudops.getronics.com/pool, operator: In, values: [ai] }
      containers:
        - name: worker
          image: worker-ai
          ports:
            - { name: probes, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: worker-ai }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 768Mi }
          livenessProbe:
            httpGet: { path: /healthz, port: probes }
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet: { path: /readyz, port: probes }
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - { name: secrets, mountPath: /mnt/secrets, readOnly: true }
            # A whole directory, never subPath: renewed files must appear in place.
            - { name: temporal-tls, mountPath: /mnt/temporal-tls, readOnly: true }
      volumes:
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: worker-ai
        - name: temporal-tls
          secret:
            secretName: worker-ai-temporal-tls
            defaultMode: 0440
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: worker-ai-temporal
spec:
  secretTargetRef:
    - { parameter: cert, name: worker-ai-temporal-tls, key: tls.crt }
    - { parameter: key, name: worker-ai-temporal-tls, key: tls.key }
    - { parameter: ca, name: worker-ai-temporal-tls, key: ca.crt }
---
# Scale on Temporal task queue depth (KEDA's temporal scaler, the AKS add-on), after
# the Deployment.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-ai
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  scaleTargetRef:
    name: worker-ai
  minReplicaCount: 1
  maxReplicaCount: 4
  triggers:
    - type: temporal
      metadata:
        endpoint: temporal-frontend.temporal.svc.cluster.local:7233
        tlsServerName: temporal-frontend.temporal.svc.cluster.local  # checked against the certificate
        namespace: default
        taskQueue: remediation-triage
        targetQueueSize: "5"
      authenticationRef:
        name: worker-ai-temporal
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: worker-ai
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker-ai
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: worker-ai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: worker-ai
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: temporal
          podSelector:
            matchLabels:
              app.kubernetes.io/component: frontend
      ports:
        - { protocol: TCP, port: 7233 }
    - to:
        - ipBlock: { cidr: SET-IN-OVERLAY }
      ports:
        - { protocol: TCP, port: 5432 }
    - ports:
        - { protocol: TCP, port: 443 }  # Entra, and storage for the bronze layer
