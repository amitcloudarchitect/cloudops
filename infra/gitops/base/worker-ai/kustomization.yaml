# The triage worker with the AI gateway in-process (LLD: npai; ADR 0007), calling
# Azure OpenAI as its workload identity (ADR 0012). Deployed by the workers
# Application, after Temporal.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: platform-ai
resources:
  - worker-ai.yaml
configMapGenerator:
  # Generated, so its name carries a hash of its contents (overlay patches included):
  # a changed setting renames it and rolls the pods that read it at start-up. Old
  # copies are kept, unpruned and ignored, so a pod of the previous revision (a canary's
  # stable side, a rollback) can still start.
  - name: worker-ai
    envs: [config.env]
    options:
      annotations:
        argocd.argoproj.io/sync-options: Prune=false
        argocd.argoproj.io/compare-options: IgnoreExtraneous
