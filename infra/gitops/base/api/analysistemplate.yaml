# Canary health from the Gateway API proxies' request metrics (Istio, reporter
# "source"), via the in-cluster Prometheus (ADR 0008, 0011). Only the canary
# Service's traffic is measured. No traffic yet (NaN) passes; a 5xx rate of 2% or a
# p95 of 500 ms fails and rolls back. Istio reports latency in milliseconds.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: api-canary-health
spec:
  metrics:
    - name: error-rate
      interval: 1m
      failureLimit: 1
      successCondition: isNaN(result[0]) || result[0] < 0.02
      provider:
        prometheus:
          address: http://prometheus-server.monitoring.svc.cluster.local
          query: |
            sum(rate(istio_requests_total{namespace="platform-edge",reporter="source",destination_service_name="api-canary",response_code=~"5.."}[2m]))
            /
            sum(rate(istio_requests_total{namespace="platform-edge",reporter="source",destination_service_name="api-canary"}[2m]))
    - name: p95-latency
      interval: 1m
      failureLimit: 1
      successCondition: isNaN(result[0]) || result[0] < 500
      provider:
        prometheus:
          address: http://prometheus-server.monitoring.svc.cluster.local
          query: |
            histogram_quantile(0.95, sum by (le) (rate(istio_request_duration_milliseconds_bucket{namespace="platform-edge",reporter="source",destination_service_name="api-canary"}[2m])))
