# Canary health from the Gateway API proxies' request metrics (Istio, reporter
# "source"), via the in-cluster Prometheus (ADR 0008, 0011). Only the canary
# Service's traffic is measured. No traffic yet (NaN) passes; a 5xx rate of 2% or a
# p95 of 500 ms fails and rolls back. Istio reports latency in milliseconds.
#
# The gateway creates the canary's series only on its first request, and a rate
# needs two samples, so the first minutes return nothing. Rollouts counts an empty
# result as an error (five in a row aborted the first canary), so each query falls
# back to NaN: "no data yet", which passes until real traffic says otherwise.
#
# Volume guard: below 50 canary requests in five minutes both checks are NaN too.
# In dev a p95 over a handful of requests swung from 5 ms to 925 ms on one slow
# call and aborted a healthy canary; with real traffic the thresholds apply as
# before. Windows are five minutes, so one burst does not decide a rollout.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: api-canary-health
spec:
  metrics:
    - name: error-rate
      interval: 1m
      failureLimit: 1
      successCondition: isNaN(result[0]) || result[0] < 0.02
      provider:
        prometheus:
          address: http://prometheus-server.monitoring.svc.cluster.local
          query: |
            (
              (sum(rate(istio_requests_total{namespace="platform-edge",reporter="source",destination_service_name="api-canary",response_code=~"5.."}[5m])) or vector(0))
              /
              sum(rate(istio_requests_total{namespace="platform-edge",reporter="source",destination_service_name="api-canary"}[5m]))
            )
            and on() (sum(increase(istio_requests_total{namespace="platform-edge",reporter="source",destination_service_name="api-canary"}[5m])) >= 50)
            or vector(NaN)
    - name: p95-latency
      interval: 1m
      failureLimit: 1
      successCondition: isNaN(result[0]) || result[0] < 500
      provider:
        prometheus:
          address: http://prometheus-server.monitoring.svc.cluster.local
          query: |
            histogram_quantile(0.95, sum by (le) (rate(istio_request_duration_milliseconds_bucket{namespace="platform-edge",reporter="source",destination_service_name="api-canary"}[5m])))
            and on() (sum(increase(istio_requests_total{namespace="platform-edge",reporter="source",destination_service_name="api-canary"}[5m])) >= 50)
            or vector(NaN)
