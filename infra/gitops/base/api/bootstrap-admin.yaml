# The first platform administrator (ADR 0002 D14, ADR 0017). Runs on every sync, after
# the migrations: `--once` creates the administrator if none exists and otherwise
# exits 0, so it can never add a second one (the database refuses either way).
#
# The administrator's Entra object id is the Key Vault secret platform-admin-oid,
# supplied per environment by a person, never in Git. The job runs as the API's
# identity (it reads the same vault) with only the two secrets it needs mounted.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: bootstrap-admin
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: SET-IN-OVERLAY
    keyvaultName: SET-IN-OVERLAY
    tenantId: SET-IN-OVERLAY
    objects: |
      array:
        - |
          objectName: postgres-app-dsn
          objectType: secret
        - |
          objectName: platform-admin-oid
          objectType: secret
---
apiVersion: batch/v1
kind: Job
metadata:
  name: bootstrap-admin
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"  # after the migrations (wave 0)
spec:
  backoffLimit: 1
  # A missing secret leaves the pod waiting on its volume; fail rather than hold the
  # sync for long.
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bootstrap-admin
        azure.workload.identity/use: "true"
    spec:
      restartPolicy: Never
      serviceAccountName: api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: cloudops.getronics.com/pool, operator: In, values: [app] }
      containers:
        - name: bootstrap-admin
          image: api
          command: ["/app/.venv/bin/python", "-m", "cloudops_api.bootstrap", "--once"]
          envFrom:
            - configMapRef: { name: api }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: secrets, mountPath: /mnt/secrets, readOnly: true }
      volumes:
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: bootstrap-admin
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bootstrap-admin
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bootstrap-admin
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - ipBlock: { cidr: SET-IN-OVERLAY }
      ports:
        - { protocol: TCP, port: 5432 }
