# Explicit allows on top of the namespace's default-deny.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api
  policyTypes: [Ingress, Egress]
  ingress:
    # Only the ingress reaches the API: the Gateway API proxies (ADR 0011).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-edge
          podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: api
      ports:
        - { protocol: TCP, port: 8000 }
  egress:
    # PostgreSQL's private endpoint (the data subnet).
    - to:
        - ipBlock: { cidr: SET-IN-OVERLAY }
      ports:
        - { protocol: TCP, port: 5432 }
    # Entra ID (signing keys, workload identity token exchange). NetworkPolicy has no
    # FQDNs; the cluster's egress path is the boundary.
    - ports:
        - { protocol: TCP, port: 443 }
    # OTLP to the OpenTelemetry Collector (step 19, ADR 0022).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - { protocol: TCP, port: 4318 }
