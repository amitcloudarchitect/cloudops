# The API (LLD, Compute: npapp). An Argo Rollouts canary (10% for 15 minutes,
# analysed on error rate and p95 latency), not a Deployment. Values that differ per
# environment are SET-IN-OVERLAY here; a test fails if one reaches a built overlay.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: platform-api
labels:
  - pairs:
      app.kubernetes.io/part-of: cloudops
    includeSelectors: false
resources:
  - serviceaccount.yaml
  - secretproviderclass.yaml
  - rollout.yaml
  - services.yaml
  - httproute.yaml
  - hpa.yaml
  - pdb.yaml
  - analysistemplate.yaml
  - networkpolicy.yaml
  - bootstrap-admin.yaml
configurations: [kustomizeconfig.yaml]
configMapGenerator:
  # Generated, so its name carries a hash of its contents (overlay patches included):
  # a changed setting renames it and rolls the pods that read it at start-up. Old
  # copies are kept, unpruned and ignored, so a pod of the previous revision (a canary's
  # stable side, a rollback) can still start.
  - name: api
    envs: [config.env]
    options:
      annotations:
        argocd.argoproj.io/sync-options: Prune=false
        argocd.argoproj.io/compare-options: IgnoreExtraneous
