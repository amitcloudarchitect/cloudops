# Front Door -> ingress-nginx -> api. /healthz is Front Door's origin probe; the
# controller exempts it from the X-Azure-FDID check (infra/cluster/ingress-nginx).
# Rollouts adds a canary copy of this Ingress during a rollout.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /healthz
            pathType: Exact
            backend:
              service: { name: api, port: { number: 8000 } }
          - path: /v1
            pathType: Prefix
            backend:
              service: { name: api, port: { number: 8000 } }
