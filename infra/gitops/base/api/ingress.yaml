# Front Door -> ingress-nginx -> api: the rollback path until ingress-nginx is removed
# (ADR 0011, phase C). Front Door's nginx origin is disabled and Rollouts no longer
# routes through this Ingress; it serves the stable API only. /healthz is Front Door's
# origin probe; the controller exempts it from the X-Azure-FDID check.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /healthz
            pathType: Exact
            backend:
              service: { name: api, port: { number: 8000 } }
          - path: /v1
            pathType: Prefix
            backend:
              service: { name: api, port: { number: 8000 } }
