# Front Door -> the Gateway API ingress (base/edge) -> api (ADR 0011). Argo Rollouts
# sets the weights here during a canary (Gateway API plugin); the platform Application
# ignores them, and the plugin's in-progress label. group and kind are the API
# server's defaults, written out so the route in Git matches the live one.
#
# /healthz is Front Door's origin probe and is open. Everything
# else must carry our Front Door profile's X-Azure-FDID (lock 2, stack 06): a request
# without it matches no rule and gets a 404 from the gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: api
      namespace: platform-edge
      sectionName: http
  rules:
    - matches:
        - path: { type: Exact, value: /healthz }
      backendRefs:
        - { group: "", kind: Service, name: api, port: 8000, weight: 100 }
        - { group: "", kind: Service, name: api-canary, port: 8000, weight: 0 }
    - matches:
        - path: { type: PathPrefix, value: /v1 }
          headers:
            - { type: Exact, name: X-Azure-FDID, value: SET-IN-OVERLAY }
      backendRefs:
        - { group: "", kind: Service, name: api, port: 8000, weight: 100 }
        - { group: "", kind: Service, name: api-canary, port: 8000, weight: 0 }
