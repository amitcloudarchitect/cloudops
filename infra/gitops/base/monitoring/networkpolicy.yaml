apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes: [Ingress, Egress]
  ingress:
    # Argo Rollouts' analysis queries.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argo-rollouts
      ports:
        - { protocol: TCP, port: 9090 }
  egress:
    # ingress-nginx's metrics endpoint.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - { protocol: TCP, port: 10254 }
    # The Gateway API proxies' merged metrics (ADR 0011).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-edge
          podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: api
      ports:
        - { protocol: TCP, port: 15020 }
    # The Kubernetes API, for service discovery.
    - ports:
        - { protocol: TCP, port: 443 }
