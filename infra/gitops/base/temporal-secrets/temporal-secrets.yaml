# Federated to id-cloudops-workflow-{env}, which may only read the app vault.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: temporal-secrets
  annotations:
    azure.workload.identity/client-id: SET-IN-OVERLAY
automountServiceAccountToken: false
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: temporal-db
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: SET-IN-OVERLAY
    keyvaultName: SET-IN-OVERLAY
    tenantId: SET-IN-OVERLAY
    objects: |
      array:
        - |
          objectName: temporal-db-password
          objectType: secret
  # The one place a secret becomes a Kubernetes Secret: Temporal's chart reads its
  # SQL password only from one. Our own workloads read files.
  secretObjects:
    - secretName: temporal-db
      type: Opaque
      data:
        - { objectName: temporal-db-password, key: password }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-secrets
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal-secrets
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal-secrets
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: temporal-secrets
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65535
        runAsGroup: 65535
        seccompProfile: { type: RuntimeDefault }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: cloudops.getronics.com/pool, operator: In, values: [ai] }
      containers:
        - name: hold-mount
          # registry.k8s.io/pause:3.10.1, imported into the platform registry
          # (az acr import; docs/kubernetes.md). Pods pull only from crcloudops*.
          image: pause
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { cpu: 50m, memory: 16Mi }
          volumeMounts:
            - { name: secrets, mountPath: /mnt/secrets, readOnly: true }
      volumes:
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: temporal-db
