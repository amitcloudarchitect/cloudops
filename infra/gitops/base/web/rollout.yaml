apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: web
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  strategy:
    canary:
      stableService: web
      canaryService: web-canary
      # As for the API (ADR 0011): the Gateway API plugin sets the weights on the
      # HTTPRoute, and the platform Application ignores them.
      trafficRouting:
        plugins:
          argoproj-labs/gatewayAPI:
            httpRoute: web
            namespace: platform-web
      analysis:
        templates:
          - templateName: web-canary-health
        startingStep: 1
      steps:
        - setWeight: 10
        - pause: { duration: 15m }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
    spec:
      serviceAccountName: web
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: cloudops.getronics.com/pool, operator: In, values: [app] }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: web
      containers:
        - name: web
          image: web
          ports:
            - { name: http, containerPort: 3000 }
          envFrom:
            - configMapRef: { name: web }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          # Latency-sensitive like the API: no CPU limit, memory always limited.
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
          # Fails while the configuration is incomplete (apps/web/src/app/healthz).
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            # Next's cache, the one path the server writes; nothing else is writable.
            - { name: next-cache, mountPath: /app/apps/web/.next/cache }
      volumes:
        - name: next-cache
          emptyDir: { sizeLimit: 256Mi }
