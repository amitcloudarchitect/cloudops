# The API's canary analysis (base/api/analysistemplate.yaml explains the queries and the
# NaN fallback), measuring the console's canary Service instead.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: web-canary-health
spec:
  metrics:
    - name: error-rate
      interval: 1m
      failureLimit: 1
      successCondition: isNaN(result[0]) || result[0] < 0.02
      provider:
        prometheus:
          address: http://prometheus-server.monitoring.svc.cluster.local
          query: |
            (sum(rate(istio_requests_total{namespace="platform-edge",reporter="source",destination_service_name="web-canary",response_code=~"5.."}[2m])) or vector(0))
            /
            (sum(rate(istio_requests_total{namespace="platform-edge",reporter="source",destination_service_name="web-canary"}[2m])) or vector(0))
    - name: p95-latency
      interval: 1m
      failureLimit: 1
      successCondition: isNaN(result[0]) || result[0] < 500
      provider:
        prometheus:
          address: http://prometheus-server.monitoring.svc.cluster.local
          query: |
            histogram_quantile(0.95, sum by (le) (rate(istio_request_duration_milliseconds_bucket{namespace="platform-edge",reporter="source",destination_service_name="web-canary"}[2m])))
            or vector(NaN)
