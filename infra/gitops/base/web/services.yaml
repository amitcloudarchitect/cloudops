# Blue-green (ADR 0017, decision 10): Rollouts points `web` at the live ReplicaSet and
# `web-preview` at the new one until it is promoted. Only `web` takes traffic.
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app.kubernetes.io/name: web
  ports:
    - { name: http, port: 3000, targetPort: http }
---
apiVersion: v1
kind: Service
metadata:
  name: web-preview
spec:
  selector:
    app.kubernetes.io/name: web
  ports:
    - { name: http, port: 3000, targetPort: http }
