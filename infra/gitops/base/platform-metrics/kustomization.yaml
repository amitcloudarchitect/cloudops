# Platform gauges from the database (step 19; ADR 0022): connector health, quarantine
# depth, reconciliation and the platform's own cost, per connector and platform-wide,
# never per tenant. The connectors image, its own command, the ingest login.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: platform-ingest
resources:
  - platform-metrics.yaml
configMapGenerator:
  - name: platform-metrics
    envs: [config.env]
    options:
      annotations:
        argocd.argoproj.io/sync-options: Prune=false
        argocd.argoproj.io/compare-options: IgnoreExtraneous
