# The Qualys connector's live path (ADR 0028): host detections, read as the Qualys
# API user; in dev, until Qualys is connected, the simulated Azure Sponsorship estate
# (ADR 0025). Read-only.
# Its worker, KEDA scaling and schedule job; Temporal over mutual TLS (ADR 0010).
# Deployed by the workers Application, after Temporal (applications/<env>/workers.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: platform-ingest
resources:
  - connector-qualys.yaml
configMapGenerator:
  # Generated, so a changed setting renames it and rolls the pods (as connector-servicenow).
  - name: connector-qualys
    envs: [config.env]
    options:
      annotations:
        argocd.argoproj.io/sync-options: Prune=false
        argocd.argoproj.io/compare-options: IgnoreExtraneous
