# Federated to id-cloudops-ingest-{env} (stack 05). Its Azure reach is what stack 04b
# grants that identity: Cost Management Reader on the platform's subscriptions, Storage
# Blob Data Reader on the export container, Contributor on its own bronze container.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: connector-azure
  annotations:
    azure.workload.identity/client-id: SET-IN-OVERLAY
automountServiceAccountToken: false
---
# Its client certificate for Temporal (mutual TLS, ADR 0010), from the internal CA.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: connector-azure-temporal
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretName: connector-azure-temporal-tls
  duration: 2160h
  renewBefore: 720h
  privateKey: { algorithm: ECDSA, size: 256, encoding: PKCS8, rotationPolicy: Always }
  commonName: connector-azure
  uris: [spiffe://cloudops.internal/ns/platform-ingest/sa/connector-azure]
  usages: [client auth]
  issuerRef: { group: cert-manager.io, kind: ClusterIssuer, name: cloudops-internal-ca }
---
# The ingest login's DSN, nothing else: there is no Azure secret to mount.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: connector-azure
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: SET-IN-OVERLAY
    keyvaultName: SET-IN-OVERLAY
    tenantId: SET-IN-OVERLAY
    objects: |
      array:
        - |
          objectName: postgres-ingest-dsn
          objectType: secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: connector-azure
spec:
  replicas: 1  # two daily entities; one worker is plenty
  selector:
    matchLabels:
      app.kubernetes.io/name: connector-azure
  template:
    metadata:
      labels:
        app.kubernetes.io/name: connector-azure
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: connector-azure
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60  # let in-flight activities finish
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532  # the certificate's key is group-readable only
        seccompProfile: { type: RuntimeDefault }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: cloudops.getronics.com/pool, operator: In, values: [ingest] }
      containers:
        - name: worker
          image: connector-servicenow  # the connectors package, another entry point
          # No --fixtures: the live path, which refuses any entity but its own two.
          command: ["/app/.venv/bin/python", "-m", "cloudops_connectors.azure", "worker"]
          ports:
            - { name: probes, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: connector-azure }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 768Mi }
          livenessProbe:
            httpGet: { path: /healthz, port: probes }
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet: { path: /readyz, port: probes }
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - { name: secrets, mountPath: /mnt/secrets, readOnly: true }
            # A whole directory, never subPath: renewed files must appear in place.
            - { name: temporal-tls, mountPath: /mnt/temporal-tls, readOnly: true }
      volumes:
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: connector-azure
        - name: temporal-tls
          secret:
            secretName: connector-azure-temporal-tls
            defaultMode: 0440
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: connector-azure
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: connector-azure
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: temporal
          podSelector:
            matchLabels:
              app.kubernetes.io/component: frontend
      ports:
        - { protocol: TCP, port: 7233 }
    - to:
        - ipBlock: { cidr: SET-IN-OVERLAY }
      ports:
        - { protocol: TCP, port: 5432 }
    # Entra (token exchange), ARM (Cost Management query, subscription listing) and
    # storage (exports, bronze). The clients pin their hosts; the token is bound to them.
    - ports:
        - { protocol: TCP, port: 443 }
    # OTLP to the OpenTelemetry Collector (step 19, ADR 0022).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - { protocol: TCP, port: 4318 }
---
# Creates or updates the daily schedules of the live entities (cost_export,
# cost_total) on every sync; safe to repeat. Never resource or invoice: the live
# path refuses them, here and in the worker.
apiVersion: batch/v1
kind: Job
metadata:
  name: connector-azure-schedule
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: connector-azure-schedule
        # The Azure profile refuses to start without a workload identity, even for
        # a job that only talks to Temporal; it is the worker's own identity.
        azure.workload.identity/use: "true"
    spec:
      restartPolicy: Never
      serviceAccountName: connector-azure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: cloudops.getronics.com/pool, operator: In, values: [ingest] }
      containers:
        - name: schedule
          image: connector-servicenow
          command: ["/app/.venv/bin/python", "-m", "cloudops_connectors.azure", "schedule",
                    "--entity", "cost_export", "--entity", "cost_total"]
          envFrom:
            - configMapRef: { name: connector-azure }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: temporal-tls, mountPath: /mnt/temporal-tls, readOnly: true }
            # The job reads no secret: an empty store, never the worker's Key Vault mount.
            - { name: no-secrets, mountPath: /mnt/secrets, readOnly: true }
      volumes:
        - name: temporal-tls
          secret:
            secretName: connector-azure-temporal-tls
            defaultMode: 0440
        - name: no-secrets
          emptyDir: { sizeLimit: 1Mi }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: connector-azure-schedule
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: connector-azure-schedule
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: temporal
          podSelector:
            matchLabels:
              app.kubernetes.io/component: frontend
      ports:
        - { protocol: TCP, port: 7233 }
    # OTLP to the OpenTelemetry Collector (step 19, ADR 0022).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - { protocol: TCP, port: 4318 }
