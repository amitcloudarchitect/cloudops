# Routes from the ingress to the web app and the API. Applied by
# scripts/bootstrap-cluster.sh; moves under Argo CD in step 12. Until the web and API
# workloads are deployed (steps 11 to 13) these backends answer 503, and Front Door's
# health probe on /healthz stays unhealthy.
apiVersion: v1
kind: Namespace
metadata:
  name: platform-web
---
apiVersion: v1
kind: Namespace
metadata:
  name: platform-api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: platform-web
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: platform-api
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # Front Door's origin probe: unauthenticated, no data (services/api).
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
